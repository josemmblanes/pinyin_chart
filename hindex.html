<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Entrenamiento Auditivo de Pinyin y Tonos en Chino</title>
<style>
  :root {
    --bg-color: #0f172a;
    --card-bg: #1e293b;
    --card-border: #334155;
    --accent: #6366f1;
    --accent-hover: #4f46e5;
    --text-primary: #f8fafc;
    --text-secondary: #94a3b8;
    --success: #10b981;
    --error: #ef4444;
  }

  body {
    font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background-color: var(--bg-color);
    color: var(--text-primary);
    max-width: 800px;
    margin: 0 auto;
    padding: 24px 16px 60px;
  }

  h1 { font-size: 24px; text-align: center; margin-bottom: 8px; color: #fff; }
  p.sub { text-align: center; color: var(--text-secondary); margin-top: 0; margin-bottom: 24px; font-size: 14px; }

  .box {
    background: var(--card-bg);
    border: 1px solid var(--card-border);
    border-radius: 12px;
    padding: 20px;
    margin-bottom: 20px;
  }

  .row { display: flex; gap: 12px; margin-bottom: 12px; flex-wrap: wrap; }
  .row > * { flex: 1; min-width: 160px; }

  label { display: block; font-size: 13px; color: var(--text-secondary); margin-bottom: 6px; font-weight: 500; }
  select, input[type=text], button {
    width: 100%;
    box-sizing: border-box;
    font-size: 15px;
    padding: 10px 12px;
    border-radius: 8px;
    border: 1px solid var(--card-border);
    background: #0f172a;
    color: var(--text-primary);
    outline: none;
  }

  select:focus, input[type=text]:focus { border-color: var(--accent); }

  button {
    cursor: pointer;
    font-weight: 600;
    background: var(--accent);
    color: #fff;
    border: none;
    transition: background 0.2s, transform 0.1s;
  }
  button:hover { background: var(--accent-hover); }
  button:active { transform: scale(0.98); }
  button:disabled { opacity: 0.5; cursor: not-allowed; }

  button.sec { background: #334155; color: var(--text-primary); }
  button.sec:hover { background: #475569; }

  /* Audio Controls */
  .audio-center { display: flex; flex-direction: column; align-items: center; justify-content: center; margin: 24px 0; }
  .btn-play {
    width: 90px; height: 90px; border-radius: 50%; font-size: 32px;
    display: flex; align-items: center; justify-content: center;
    background: linear-gradient(135deg, #6366f1, #8b5cf6);
    box-shadow: 0 4px 20px rgba(99, 102, 241, 0.4);
    margin-bottom: 12px;
  }
  .btn-play.playing { animation: pulse 1.2s infinite; }

  @keyframes pulse {
    0% { box-shadow: 0 0 0 0 rgba(99, 102, 241, 0.7); }
    70% { box-shadow: 0 0 0 18px rgba(99, 102, 241, 0); }
    100% { box-shadow: 0 0 0 0 rgba(99, 102, 241, 0); }
  }

  /* Game Area */
  .options-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(110px, 1fr)); gap: 12px; margin-top: 16px; }
  .btn-opt { font-size: 20px; padding: 16px; background: #0f172a; border: 1px solid var(--card-border); }
  .btn-opt:hover { border-color: var(--accent); background: #1e1b4b; }

  .feedback { text-align: center; font-size: 16px; font-weight: bold; min-height: 24px; margin-top: 12px; }
  .feedback.ok { color: var(--success); }
  .feedback.err { color: var(--error); }

  /* Stats */
  .stats-bar { display: flex; justify-content: space-around; text-align: center; border-bottom: 1px solid var(--card-border); padding-bottom: 12px; margin-bottom: 16px; }
  .stat-val { font-size: 20px; font-weight: bold; color: var(--accent); }
  .stat-lbl { font-size: 12px; color: var(--text-secondary); }

  /* Explorer */
  .grid-explorer { display: grid; grid-template-columns: repeat(auto-fill, minmax(80px, 1fr)); gap: 8px; max-height: 300px; overflow-y: auto; padding-right: 4px; }
  .tile-pinyin { background: #0f172a; border: 1px solid var(--card-border); border-radius: 6px; padding: 8px; text-align: center; font-size: 14px; cursor: pointer; }
  .tile-pinyin:hover { border-color: var(--accent); color: var(--accent); }

  .nav-tabs { display: flex; gap: 8px; margin-bottom: 16px; }
  .nav-tabs button { flex: 1; padding: 8px; font-size: 14px; background: transparent; border: 1px solid var(--card-border); color: var(--text-secondary); }
  .nav-tabs button.active { background: var(--accent); color: #fff; border-color: var(--accent); }
</style>
</head>
<body>

<h1>🎧 Entrenamiento Auditivo de Pinyin y Tonos</h1>
<p class="sub">Reconocimiento fonético de sílabas en chino mandarín</p>

<!-- Configuración del Sintetizador -->
<div class="box">
  <div class="row">
    <div>
      <label for="proveedor">Sintetizador (Puter.js)</label>
      <select id="proveedor">
        <option value="elevenlabs">ElevenLabs</option>
        <option value="gemini">Google Gemini</option>
        <option value="openai">OpenAI</option>
        <option value="aws-polly">Amazon Polly (neural)</option>
      </select>
    </div>
    <div>
      <label for="voz">Voz seleccionada</label>
      <select id="voz"></select>
    </div>
    <div>
      <label for="vel">Velocidad</label>
      <select id="vel">
        <option value="1">1.0× (Normal)</option>
        <option value="0.85" selected>0.85× (Recomendada)</option>
        <option value="0.75">0.75× (Lenta)</option>
        <option value="0.65">0.65× (Muy lenta)</option>
      </select>
    </div>
  </div>
  <button id="btnProbarVoz" class="sec">🔊 Probar voz actual ("Nǐ hǎo")</button>
</div>

<!-- Selector de Modo -->
<div class="nav-tabs">
  <button id="tabGame" class="active" onclick="switchTab('game')">🎮 Modos de Juego</button>
  <button id="tabExplorer" onclick="switchTab('explorer')">📚 Explorador de Tonos</button>
</div>

<!-- Pestaña de Juego -->
<div id="secGame">
  <div class="box">
    <div class="stats-bar">
      <div><div id="stRacha" class="stat-val">0</div><div class="stat-lbl">Racha</div></div>
      <div><div id="stAciertos" class="stat-val">0</div><div class="stat-lbl">Aciertos</div></div>
      <div><div id="stPrec" class="stat-val">0%</div><div class="stat-lbl">Precisión</div></div>
    </div>

    <div class="row">
      <div>
        <label for="dificultad">Nivel de Dificultad</label>
        <select id="dificultad">
          <option value="1">Fácil (3 Opciones)</option>
          <option value="2">Medio (6 Opciones - Distractores)</option>
          <option value="3">Difícil (Escribir respuesta pinyin/número)</option>
        </select>
      </div>
    </div>

    <div class="audio-center">
      <button id="btnPlay" class="btn-play" title="Reproducir Sonido">🔊</button>
      <span style="font-size:12px; color:var(--text-secondary)">Haz clic para escuchar la sílaba</span>
    </div>

    <!-- Opciones / Entrada según nivel -->
    <div id="containerOptions" class="options-grid"></div>

    <div id="containerInput" style="display:none; margin-top:16px;">
      <label for="txtRespuesta">Escribe el pinyin con el número del tono (ej. ma3, shi1, guo2):</label>
      <div class="row">
        <input type="text" id="txtRespuesta" placeholder="Ej: ma3" autocomplete="off" spellcheck="false">
        <button id="btnEnviar" style="max-width:120px;">Enviar</button>
      </div>
    </div>

    <div id="feedback" class="feedback"></div>
  </div>
</div>

<!-- Pestaña Explorador -->
<div id="secExplorer" class="box" style="display:none;">
  <label>Haz clic en cualquier sílaba para escucharla en sus 4 tonos:</label>
  <div id="explorerGrid" class="grid-explorer" style="margin-top:12px;"></div>
</div>

<script>
const PUTER_SCRIPT = "https://js.puter.com/v2/";
const puterReady = new Promise((resolve) => {
  if (window.puter) return resolve(true);
  const sc = document.createElement("script");
  sc.src = PUTER_SCRIPT;
  sc.onload = () => resolve(!!window.puter);
  sc.onerror = () => resolve(false);
  document.head.appendChild(sc);
});

/* Base de datos fonética simplificada */
const INITIALS = ["b","p","m","f","d","t","n","l","g","k","h","j","q","x","zh","ch","sh","r","z","c","s"];
const FINALS = ["a","o","e","i","u","ü","ai","ei","ao","ou","an","en","ang","eng","ong"];
const SYLLABLES = [
  "ba","pa","ma","fa","da","ta","na","la","ga","ka","ha","ji","qi","xi","zha","cha","sha","ra","za","ca","sa",
  "bo","po","mo","fo","de","te","ne","le","ge","ke","he","zhi","chi","shi","ri","zi","ci","si",
  "mai","fei","dao","tou","nan","leng","guo","kuai","huan","jun","xiong"
];

const TONE_MARKS = {
  a: ["ā","á","ǎ","à"], e: ["ē","é","ě","è"], o: ["ō","ó","ǒ","ò"],
  i: ["ī","í","ǐ","ì"], u: ["ū","ú","ǔ","ù"], ü: ["ǖ","ǘ","ǚ","ǜ"]
};

function addToneToPinyin(pinyin, tone) {
  if (tone === 5) return pinyin;
  let target = "a";
  if (pinyin.includes("a")) target = "a";
  else if (pinyin.includes("e")) target = "e";
  else if (pinyin.includes("ou")) target = "o";
  else {
    for (let i = pinyin.length - 1; i >= 0; i--) {
      if ("iueü".includes(pinyin[i])) { target = pinyin[i]; break; }
    }
  }
  if (TONE_MARKS[target]) {
    return pinyin.replace(target, TONE_MARKS[target][tone - 1]);
  }
  return pinyin + tone;
}

const FALLBACK_VOICES = {
  elevenlabs: [["21m00Tcm4TlvDq8ikWAM","Rachel"],["EXAVITQu4vr4xnSDxMaL","Bella"],["pNInz6obpgDQGcFmaJgB","Adam"]],
  gemini: [["Kore","Kore"],["Aoede","Aoede"],["Leda","Leda"],["Puck","Puck"]],
  openai: [["nova","Nova"],["shimmer","Shimmer"],["onyx","Onyx"],["echo","Echo"]],
  "aws-polly": [["Zhiyu","Zhiyu"]]
};

let currentSyllable = "";
let currentTone = 1;
let currentPinyinWithTone = "";
let currentNumericPinyin = "";

let stats = { racha: 0, aciertos: 0, total: 0 };

const $ = id => document.getElementById(id);

async function loadVoices() {
  const p = $("proveedor").value;
  const sel = $("voz");
  sel.innerHTML = "";
  
  let voices = FALLBACK_VOICES[p].map(([id, name]) => ({ id, name }));
  
  if (await puterReady) {
    try {
      const all = await puter.ai.txt2speech.listVoices({ provider: p });
      let filtered = all.filter(v => v.language && /^(zh|cmn)/i.test(v.language.code));
      if (filtered.length) voices = filtered.map(v => ({ id: v.id, name: v.name || v.id }));
    } catch(e) {}
  }

  voices.forEach(v => {
    const opt = document.createElement("option");
    opt.value = v.id;
    opt.textContent = v.name;
    sel.appendChild(opt);
  });
}

function getTTSOptions() {
  const p = $("proveedor").value;
  const v = $("voz").value;
  switch (p) {
    case "elevenlabs": return { provider: "elevenlabs", model: "eleven_multilingual_v2", voice: v };
    case "gemini":     return { provider: "gemini", voice: v, language: "zh-CN" };
    case "openai":     return { provider: "openai", model: "gpt-4o-mini-tts", voice: v };
    case "aws-polly":  return { provider: "aws-polly", voice: v || "Zhiyu", engine: "neural", language: "cmn-CN" };
  }
}

async function speak(text) {
  if (!(await puterReady)) return;
  $("btnPlay").classList.add("playing");
  try {
    const audio = await puter.ai.txt2speech(text, getTTSOptions());
    if (audio) {
      audio.playbackRate = parseFloat($("vel").value) || 1;
      audio.onended = () => $("btnPlay").classList.remove("playing");
      audio.play();
    } else {
      $("btnPlay").classList.remove("playing");
    }
  } catch(e) {
    $("btnPlay").classList.remove("playing");
  }
}

function generateTarget() {
  currentSyllable = SYLLABLES[Math.floor(Math.random() * SYLLABLES.length)];
  currentTone = Math.floor(Math.random() * 4) + 1;
  currentPinyinWithTone = addToneToPinyin(currentSyllable, currentTone);
  currentNumericPinyin = currentSyllable + currentTone;

  $("feedback").textContent = "";
  $("feedback").className = "feedback";
  $("txtRespuesta").value = "";

  renderChallenge();
}

function renderChallenge() {
  const diff = $("dificultad").value;
  const optsContainer = $("containerOptions");
  const inputContainer = $("containerInput");

  optsContainer.innerHTML = "";
  
  if (diff === "3") {
    optsContainer.style.display = "none";
    inputContainer.style.display = "block";
    $("txtRespuesta").focus();
  } else {
    optsContainer.style.display = "grid";
    inputContainer.style.display = "none";

    const numOpts = diff === "1" ? 3 : 6;
    let options = [currentPinyinWithTone];

    while (options.length < numOpts) {
      let randSyl = diff === "2" ? currentSyllable : SYLLABLES[Math.floor(Math.random() * SYLLABLES.length)];
      let randTone = Math.floor(Math.random() * 4) + 1;
      let cand = addToneToPinyin(randSyl, randTone);
      if (!options.includes(cand)) options.push(cand);
    }

    options.sort(() => Math.random() - 0.5);

    options.forEach(opt => {
      const btn = document.createElement("button");
      btn.className = "btn-opt";
      btn.textContent = opt;
      btn.onclick = () => checkAnswer(opt);
      optsContainer.appendChild(btn);
    });
  }
}

function checkAnswer(userAns) {
  stats.total++;
  const cleanAns = userAns.trim().toLowerCase();
  const isCorrect = cleanAns === currentPinyinWithTone || cleanAns === currentNumericPinyin;

  if (isCorrect) {
    stats.aciertos++;
    stats.racha++;
    $("feedback").textContent = `¡Correcto! 🎉 (${currentPinyinWithTone})`;
    $("feedback").className = "feedback ok";
    setTimeout(generateTarget, 1200);
  } else {
    stats.racha = 0;
    $("feedback").textContent = `Incorrecto. Era: ${currentPinyinWithTone} (${currentNumericPinyin})`;
    $("feedback").className = "feedback err";
  }

  updateStats();
}

function updateStats() {
  $("stRacha").textContent = stats.racha;
  $("stAciertos").textContent = stats.aciertos;
  const pct = stats.total > 0 ? Math.round((stats.aciertos / stats.total) * 100) : 0;
  $("stPrec").textContent = pct + "%";
}

function buildExplorer() {
  const grid = $("explorerGrid");
  grid.innerHTML = "";
  SYLLABLES.forEach(syl => {
    for (let t = 1; t <= 4; t++) {
      const pinyin = addToneToPinyin(syl, t);
      const tile = document.createElement("div");
      tile.className = "tile-pinyin";
      tile.textContent = pinyin;
      tile.onclick = () => speak(pinyin);
      grid.appendChild(tile);
    }
  });
}

function switchTab(tab) {
  if (tab === 'game') {
    $("secGame").style.display = "block";
    $("secExplorer").style.display = "none";
    $("tabGame").classList.add("active");
    $("tabExplorer").classList.remove("active");
  } else {
    $("secGame").style.display = "none";
    $("secExplorer").style.display = "block";
    $("tabGame").classList.remove("active");
    $("tabExplorer").classList.add("active");
  }
}

/* Event Handlers */
$("proveedor").onchange = loadVoices;
$("btnProbarVoz").onclick = () => speak("你好");
$("btnPlay").onclick = () => speak(currentPinyinWithTone);
$("dificultad").onchange = renderChallenge;
$("btnEnviar").onclick = () => checkAnswer($("txtRespuesta").value);
$("txtRespuesta").onkeyup = (e) => { if (e.key === "Enter") checkAnswer($("txtRespuesta").value); };

/* Inicialización */
loadVoices();
generateTarget();
buildExplorer();
</script>
</body>
</html>
